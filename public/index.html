<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IGStory Bot V2 — Control Panel</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="hero">
  <h1>IGStory Bot V2</h1>
  <p class="tagline">Live control panel — paste a link, pick a mode, hit run</p>
</header>

<main>
  <section class="panel controls">
    <label class="field">
      <span>Instagram link or @username (for target modes)</span>
      <input id="link" type="text" placeholder="https://instagram.com/username  or  @username  or  reel link" />
    </label>

    <div class="field">
      <span>Mode</span>
      <div id="mode-buttons" class="mode-buttons">
        <button class="mode-btn active" data-mode="view_stories">👁 View Stories</button>
        <button class="mode-btn" data-mode="love_stories">💖 Love Stories</button>
        <button class="mode-btn" data-mode="view_reels">🎞 View Reels</button>
        <button class="mode-btn" data-mode="love_reels">❤️ Love Reel</button>
      </div>
    </div>

    <div class="actions">
      <button id="run" class="run">▶ Run</button>
      <button id="stop" class="stop">■ Stop</button>
    </div>

    <label class="field small">
      <span>API URL (where webapp.py runs; blank = same site)</span>
      <input id="api-url" type="text" placeholder="https://your-backend.example.com" />
    </label>
    <label class="field small">
      <span>API key (only if the backend has API_KEY set)</span>
      <input id="api-key" type="password" placeholder="optional" />
    </label>
  </section>

  <section class="panel">
    <h2>Status: <strong id="status">idle</strong></h2>
    <pre id="logs" class="logs">No runs yet.</pre>
  </section>
</main>

<footer>
  <p>IGStory Bot V2.4 — for educational purposes only. Automating Instagram may violate their Terms of Service.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
